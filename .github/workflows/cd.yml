name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Satis
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build Satis repository
        run: composer satis:build

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SATIS_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '[packages.phpinnacle.com]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFjPJ3tLfme/nORFm//qYTLN1BRO9F15Rsz61PDKTvS0' > ~/.ssh/known_hosts

      - name: Deploy Satis repository
        env:
          RSYNC_RSH: ssh -p 2222
        run: |
          rsync -az build/satis/dist/ deploy@packages.phpinnacle.com:/srv/packages.phpinnacle.com/dist/
          rsync -az --exclude dist --exclude packages.json build/satis/ deploy@packages.phpinnacle.com:/srv/packages.phpinnacle.com/
          rsync -az build/satis/packages.json deploy@packages.phpinnacle.com:/srv/packages.phpinnacle.com/packages.json
