name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: packages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Split packages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Split packages
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SPLIT_TOKEN }}
        run: |
          gh auth setup-git

          for package in packages/*; do
            name="${package#packages/}"
            [[ "$name" == 'skeleton' ]] && continue
            split="$(git subtree split --prefix="$package" HEAD)"
            git push --force "https://github.com/phpinnacle/${name}.git" "${split}:refs/heads/master"
          done
