name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: rdkafka
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check code style
        run: composer lint

      - name: Run tests
        run: composer test

  javascript-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: [atlas, cabeiro, decima, eidos, jason, tempo, vulcan]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/${{ matrix.package }}

      - name: Run tests
        run: npm test
        working-directory: packages/${{ matrix.package }}

  jason:
    name: Jason without framework dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Jason dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: packages/jason

      - name: Run Jason tests
        run: composer test
        working-directory: packages/jason

  eidos:
    name: Eidos without Ferry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - name: Install Eidos dependencies
        working-directory: packages/eidos
        run: |
          composer config minimum-stability dev
          composer config --json repositories.jason '{"type":"path","url":"../jason","options":{"versions":{"phpinnacle/jason":"dev-master"}}}'
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run Eidos tests
        run: composer test
        working-directory: packages/eidos
