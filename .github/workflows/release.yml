name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name to release, or leave empty to release all packages
        required: false
        type: string
      version:
        description: Package version without a v prefix, for example 1.0.0
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: packages-deploy
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/master' ]]; then
            echo 'Releases must run from master.' >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Version must be a semantic version without a v prefix.' >&2
            exit 1
          fi

          if [[ -n "$PACKAGE" ]]; then
            if [[ ! "$PACKAGE" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo 'Package must be a valid package directory name.' >&2
              exit 1
            fi

            if [[ "$PACKAGE" == 'skeleton' || ! -f "packages/$PACKAGE/composer.json" ]]; then
              echo "phpinnacle/$PACKAGE is not a publishable package." >&2
              exit 1
            fi
          fi

          conclusion="$(gh run list --workflow CI --commit "$GITHUB_SHA" --limit 1 --json conclusion,status --jq '.[0] | select(.status == "completed") | .conclusion')"

          if [[ "$conclusion" != 'success' ]]; then
            echo 'The selected master commit does not have a successful CI run.' >&2
            exit 1
          fi

      - name: Tag package mirrors
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SPLIT_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          gh auth setup-git

          if [[ -n "$PACKAGE" ]]; then
            packages=("packages/$PACKAGE")
          else
            packages=(packages/*)
          fi

          for package in "${packages[@]}"; do
            name="${package#packages/}"
            [[ "$name" == 'skeleton' ]] && continue
            remote="https://github.com/phpinnacle/${name}.git"
            split="$(git subtree split --prefix="$package" "$GITHUB_SHA")"
            existing="$(git ls-remote --refs "$remote" "refs/tags/$VERSION" | awk '{print $1}')"

            if [[ -n "$existing" && "$existing" != "$split" ]]; then
              echo "phpinnacle/${name} already has a different $VERSION tag." >&2
              exit 1
            fi

            if [[ -z "$existing" ]]; then
              git push "$remote" "$split:refs/tags/$VERSION"
            fi
          done
