#:schema vendor/carthage-software/mago/schema.json

version = "1.47.4"
php-version = "8.4"

[source]
paths = ["packages", "tests"]
excludes = ["packages/*/node_modules/**", "packages/*/vendor/**"]

[formatter]
preset = "laravel"
sort-class-methods = false
space-after-logical-not-unary-prefix-operator = false
space-around-concatenation-binary-operator = true
