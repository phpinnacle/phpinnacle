#:schema vendor/carthage-software/mago/schema.json

extends = "vendor/phpinnacle/grimoire/mago.toml"

version = "1.47.4"
php-version = "8.4"

[source]
paths = ["packages", "tests"]
excludes = ["packages/*/node_modules/**", "packages/*/vendor/**", "packages/grimoire/tests/corpus/**"]

[linter.rules.strict-types]
enabled = false

[linter.rules.prefer-static-closure]
enabled = false

[linter.rules.no-else-clause]
enabled = false

[linter.rules.no-boolean-flag-parameter]
enabled = false

[linter.rules.prefer-early-continue]
enabled = false

[linter.rules.no-literal-password]
enabled = false

[linter.rules.constant-name]
enabled = false

[linter.rules.literal-named-argument]
threshold = 2

[linter.rules.file-name]
exclude = ["packages/*/tests/**"]

[linter.rules.single-class-per-file]
exclude = ["packages/*/tests/**"]

[linter.rules.halstead]
exclude = ["packages/*/tests/**"]
volume-threshold = 1500
difficulty-threshold = 16
effort-threshold = 8000

[linter.rules.excessive-parameter-list]
constructor-threshold = 14

[linter.rules.too-many-methods]
enabled = false

[linter.rules.cyclomatic-complexity]
enabled = false

[linter.rules.kan-defect]
enabled = false

[formatter]
preset = "laravel"
sort-class-methods = false
space-after-logical-not-unary-prefix-operator = false
space-around-concatenation-binary-operator = true
